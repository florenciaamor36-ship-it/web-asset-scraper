name: Deploy web interface to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static web app
        env:
          CAPTURE_API_BASE_URL: ${{ vars.CAPTURE_API_BASE_URL }}
        run: |
          mkdir -p public
          cp index.html public/index.html
          python3 - <<'PY'
          import json, os
          value = os.environ.get("CAPTURE_API_BASE_URL", "").strip().rstrip("/")
          with open("public/runtime-config.js", "w", encoding="utf-8") as f:
              f.write("window.WEBASSET_API_BASE = " + json.dumps(value) + ";\n")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4