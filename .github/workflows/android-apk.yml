name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build debug APK
        run: gradle --no-daemon testDebugUnitTest --tests com.example.scraper.LocalCaptureTest --tests com.example.scraper.RuntimeRequestRecorderTest assembleDebug -PcaptureApiBaseUrl="${{ vars.CAPTURE_API_BASE_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: webasset-scraper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14