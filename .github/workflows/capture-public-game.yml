name: Capture public demo game resources
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public demo URL (approved game hosts only)
        required: true
        type: string
      play_seconds:
        description: Time to interact with the free demo
        required: true
        default: '300'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture resources while playing the public demo
        env:
          TARGET_URL: ${{ inputs.target_url }}
          PLAY_SECONDS: ${{ inputs.play_seconds }}
        run: python tools/capture_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: hearts-venus-capture-${{ github.run_id }}
          path: capture-output/
          if-no-files-found: error
          retention-days: 30
