name: Validate Hearts of Venus 5x4 preview
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Load published page and play one spin
        run: python tools/validate_hearts_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearts-venus-preview-browser-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 7
